<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لوحة التحكم - إدارة ديروط التعليمية</title>
  
  <!-- ✅ PWA Meta Tags - manifest منفصل -->
  <link rel="manifest" href="./manifest-admin.json">
  <meta name="theme-color" content="#fbbf24">
  <meta name="background-color" content="#1e1b4b">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="لوحة تحكم المدارس">
  <link rel="apple-touch-icon" href="./icon-admin-192.png">
  <link rel="manifest" href="./manifest-admin.json">
<meta name="theme-color" content="#fbbf24"> 
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      background: #1e1b4b !important;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    
    body {
      font-family: 'Tajawal', sans-serif;
    }
    
    /* ===== شاشة التحميل ===== */
    #splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #312e81 70%, #4338ca 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    
    #splash.hide {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }
    
    .splash-logo {
      width: 130px;
      height: 130px;
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.2));
      backdrop-filter: blur(20px);
      border-radius: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      margin-bottom: 32px;
      border: 2px solid rgba(251, 191, 36, 0.4);
      animation: logoPulse 2.5s ease-in-out infinite;
      box-shadow: 0 25px 70px rgba(251, 191, 36, 0.3);
    }
    
    @keyframes logoPulse {
      0%, 100% { 
        transform: scale(1) rotate(0deg); 
        box-shadow: 0 25px 70px rgba(251, 191, 36, 0.3);
      }
      50% { 
        transform: scale(1.08) rotate(5deg); 
        box-shadow: 0 35px 90px rgba(251, 191, 36, 0.5);
      }
    }
    
    .splash-title {
      color: #fbbf24;
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 14px;
      text-shadow: 0 4px 25px rgba(251, 191, 36, 0.4);
      letter-spacing: 0.5px;
    }
    
    .splash-sub {
      color: rgba(255,255,255,0.8);
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 55px;
      text-shadow: 0 2px 15px rgba(0,0,0,0.3);
    }
    
    .splash-loader {
      width: 260px;
      height: 5px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    
    .splash-loader-bar {
      height: 100%;
      background: linear-gradient(90deg, #fbbf24, #f59e0b, #f97316, #ef4444);
      border-radius: 10px;
      width: 0%;
      animation: loadBar 2.5s ease-in-out forwards;
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.6);
    }
    
    @keyframes loadBar {
      0% { width: 0%; }
      25% { width: 25%; }
      50% { width: 55%; }
      75% { width: 80%; }
      100% { width: 100%; }
    }
    
    .splash-footer {
      position: absolute;
      bottom: 35px;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      font-weight: 500;
    }
    
    /* ===== الـ iframe ===== */
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      background: white;
    }
    
    #appFrame.show { opacity: 1; }
    
    /* ===== زر التثبيت ===== */
    #installBanner {
      display: none;
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #1e1b4b;
      padding: 16px 28px;
      border-radius: 50px;
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 15px 40px rgba(251,191,36,0.5);
      z-index: 2000;
      cursor: pointer;
      border: none;
      animation: slideUp 0.6s ease;
      align-items: center;
      gap: 10px;
    }
    
    @keyframes slideUp {
      from { 
        transform: translateX(-50%) translateY(40px); 
        opacity: 0; 
      }
      to { 
        transform: translateX(-50%) translateY(0); 
        opacity: 1; 
      }
    }
    
    #installBanner:hover {
      transform: translateX(-50%) translateY(-3px);
      box-shadow: 0 20px 50px rgba(251,191,36,0.7);
    }
    
    /* ===== زر الطوارئ ===== */
    #fallbackBtn {
      display: none;
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      padding: 16px 28px;
      border-radius: 50px;
      font-family: 'Tajawal', sans-serif;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 15px 40px rgba(239,68,68,0.5);
      z-index: 2000;
      cursor: pointer;
      border: none;
      text-decoration: none;
      animation: slideUp 0.6s ease;
      align-items: center;
      gap: 10px;
    }
    
    @media (max-width: 480px) {
      .splash-logo { width: 110px; height: 110px; font-size: 54px; }
      .splash-title { font-size: 28px; }
      .splash-sub { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- شاشة التحميل -->
  <div id="splash">
    <div class="splash-logo">🛡️</div>
    <div class="splash-title">لوحة تحكم المدير العام</div>
    <div class="splash-sub">إدارة ديروط التعليمية</div>
    <div class="splash-loader">
      <div class="splash-loader-bar"></div>
    </div>
    <div class="splash-footer">
      تصميم وتطوير: أ/ محمود حسن خرابة
    </div>
  </div>

  <!-- الـ iframe -->
  <iframe id="appFrame" 
    src="https://script.google.com/macros/s/AKfycby8yzUjJ00bFWpjvVVN3ChfEV6xfMIu1_f9BWzOpNPnNbRt3AwM-r6N1fIiGsXA3WM/exec?admin=true"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"
    allow="fullscreen; camera; microphone; geolocation; clipboard-write"
    title="لوحة التحكم">
  </iframe>

  <!-- زر التثبيت -->
  <button id="installBanner" onclick="installApp()">
    <i class="fas fa-mobile-alt"></i>
    <span>تثبيت لوحة التحكم كتطبيق</span>
  </button>

  <!-- زر الطوارئ -->
  <a id="fallbackBtn" href="#" target="_blank">
    <i class="fas fa-external-link-alt"></i>
    <span>فتح لوحة التحكم مباشرة</span>
  </a>

  <script>
    // ===== رابط التطبيق =====
    const APP_URL = 'https://script.google.com/macros/s/AKfycby8yzUjJ00bFWpjvVVN3ChfEV6xfMIu1_f9BWzOpNPnNbRt3AwM-r6N1fIiGsXA3WM/exec?admin=true';
    document.getElementById('fallbackBtn').href = APP_URL;

    const frame = document.getElementById('appFrame');
    const splash = document.getElementById('splash');
    const fallbackBtn = document.getElementById('fallbackBtn');

    // ===== إخفاء شاشة التحميل =====
    frame.onload = function() {
      setTimeout(() => {
        splash.classList.add('hide');
        frame.classList.add('show');
      }, 600);
    };

    // ===== خطة الطوارئ =====
    setTimeout(() => {
      if (!splash.classList.contains('hide')) {
        splash.style.opacity = '0.3';
        fallbackBtn.style.display = 'flex';
      }
    }, 10000);

    // ===== PWA Install =====
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(() => {
        document.getElementById('installBanner').style.display = 'flex';
      }, 3000);
    });

    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(choice => {
          if (choice.outcome === 'accepted') {
            console.log('✅ تم تثبيت لوحة التحكم');
          }
          document.getElementById('installBanner').style.display = 'none';
          deferredPrompt = null;
        });
      }
    }

    // ✅ تسجيل Service Worker المنفصل
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw-admin.js')
        .then(() => console.log('Admin SW registered'))
        .catch(err => console.log('Admin SW failed:', err));
    }
  </script>
</body>
</html>
